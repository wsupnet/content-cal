name: contentcal

services:
  contentcal:
    build: ./backend
    container_name: contentcal
    restart: unless-stopped
    # Linux and NAS: run as your own account instead of root (recommended). Use
    # the output of `id -u` and `id -g`, and first give that account the data
    # folder, for example: sudo chown -R 1000:1000 ./data
    # Left commented so existing installs (whose files root owns) keep working.
    # user: "1000:1000"
    ports:
      - "8765:8000"          # Change 8765 to any port you want
    volumes:
      - ./frontend:/frontend:ro          # Serves the HTML frontend
      - ./backend/main.py:/app/main.py:ro # to prevent the need to rebuild the container
      # Your calendar.db, .session_secret and backups live in this folder. It is
      # ./data unless you set CONTENTCAL_DATA in .env (see .env.example).
      - ${CONTENTCAL_DATA:-./data}:/app/data
    environment:
      - DATA_DIR=/app/data
      # Optional safety check for an established install: set
      # REQUIRE_EXISTING_DB=1 in .env to refuse to start if calendar.db is missing
      # (a wrong path or an unmounted drive) instead of creating an empty one.
      - REQUIRE_EXISTING_DB=${REQUIRE_EXISTING_DB:-}
      # Behind a reverse proxy (Caddy, nginx, Traefik…)? Without this, uvicorn
      # sees every user as the proxy's IP, so all users share one rate-limit
      # bucket. Trust ONLY the proxy, and only when every request goes through
      # it:
      #   - proxy in this compose network: remove the `ports:` mapping above
      #     and set this to the proxy container's IP or subnet (CIDR works);
      #   - proxy on the host: publish as "127.0.0.1:8765:8000" so only the host
      #     can connect, then set this to the Docker gateway IP.
      # Never trust the gateway while the port is reachable from the network:
      # anyone could then fake their IP with an X-Forwarded-For header.
      # - FORWARDED_ALLOW_IPS=172.18.0.10
      # Largest body for channel saves / CSV import chunks (default 2.5 MB).
      # Other requests are capped lower in code (256 KB; 16 KB when logged out).
      # - MAX_REQUEST_BYTES=2621440
      # Database snapshots kept in the data folder's backups/ (one at each
      # start, then one a day). Back up that folder, not calendar.db. 0 = off.
      # - BACKUP_KEEP=14
      # Serving over HTTPS (reverse proxy, Tailscale Serve)? Mark the login
      # cookie HTTPS-only. Don't set it for plain http:// or logins will fail.
      # - COOKIE_SECURE=1
      # Sign-up is invite-only by default. Set to 1 to let anyone who can reach
      # the server create an account.
      # - ALLOW_OPEN_SIGNUP=1

networks:
  default:
    name: contentcal_net
