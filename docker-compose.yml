name: contentcal

services:
  contentcal:
    build: ./backend
    container_name: contentcal
    restart: unless-stopped
    ports:
      - "8765:8000"          # Change 8765 to any port you want
    volumes:
      - ./frontend:/frontend:ro          # Serves the HTML frontend
      - ./backend/main.py:/app/main.py:ro # to prevent the need to rebuild the container
      # App data lives OUTSIDE the repo. APPDATA comes from .env (not in Git);
      # see .env.example. calendar.db and .session_secret live in this folder.
      - ${APPDATA:?APPDATA is not set}/contentcal:/app/data
    environment:
      - DATA_DIR=/app/data
      # Refuse to start if $APPDATA/contentcal/calendar.db is missing instead of
      # creating an empty one. Comment out for a brand-new install's very first run.
      - REQUIRE_EXISTING_DB=1

networks:
  default:
    name: contentcal_net
