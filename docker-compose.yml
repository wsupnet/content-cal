version: "3.9"

services:
  contentcal:
    build: ./backend
    container_name: contentcal
    restart: unless-stopped
    ports:
      - "8765:8000"          # Change 8765 to any port you want
    volumes:
      - ./frontend:/frontend:ro          # Serves the HTML frontend
      - ./backend/main.py:/app/main.py:ro # to prevent the need to rebuild the container
      - ./data:/app/data                  # calendar.db lives here (gitignored, never in the repo)
    environment:
      - DATA_DIR=/app/data
      # Refuse to start if ./data/calendar.db is missing instead of creating an
      # empty one. Comment out for a brand-new install's very first run.
      - REQUIRE_EXISTING_DB=1

networks:
  default:
    name: contentcal_net
